<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素塔防：遷徙之戰</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="stats">
          <span class="stat" title="生命"><b>❤</b> <span id="lives">0</span></span>
          <span class="stat" title="金幣"><b>💰</b> <span id="gold">0</span></span>
          <span class="stat" title="波次"><b>🌊</b> <span id="wave">0</span></span>
          <span class="stat map" title="目前地圖"><b>🗺</b> <span id="map-name"></span></span>
          <span class="stat shift" id="map-shift" title="距離地圖變遷"></span>
        </div>
        <div class="controls">
          <button id="btn-start" class="primary">開始第 1 波</button>
          <button id="btn-auto" title="波次結束後自動開始下一波">自動：關</button>
          <button id="btn-speed" title="遊戲速度 (F)">1×</button>
          <button id="btn-pause" title="暫停 (P)">⏸</button>
          <button id="btn-sound" title="音效">🔊</button>
          <button id="btn-help" title="說明 (H)">❓</button>
          <button id="btn-menu" title="主選單">☰</button>
        </div>
      </header>

      <main id="layout">
        <div id="board">
          <canvas id="canvas"></canvas>
          <div id="banner" hidden></div>
          <div id="toasts"></div>
          <div id="paused-overlay" hidden>暫停中</div>
        </div>

        <aside id="side">
          <section class="panel">
            <h2>建造 <small>點選後放到地圖上</small></h2>
            <div id="shop"></div>
          </section>
          <section class="panel" id="info-panel">
            <h2>塔的資訊</h2>
            <div id="info"><p class="hint">點選地圖上的塔查看、升級、合成或賣出。<br />把同種同星的塔拖到另一座上即可合成。</p></div>
          </section>
          <section class="panel" id="bench-panel">
            <h2>倉庫 <small id="bench-count"></small></h2>
            <div id="bench"><p class="hint">地圖變遷時，所有塔會收進倉庫，可免費重新部署。</p></div>
          </section>
          <section class="panel">
            <h2>下一波 <small id="next-wave-no"></small></h2>
            <div id="next-wave"></div>
          </section>
        </aside>
      </main>

      <div id="menu" class="overlay">
        <div class="dialog">
          <h1>像素塔防：遷徙之戰</h1>
          <p class="sub">建塔、升級、合成，撐過每 20 波一次的地圖變遷！</p>
          <div class="difficulty" id="difficulty"></div>
          <div class="actions">
            <button id="btn-new" class="primary big">新遊戲</button>
            <button id="btn-continue" class="big" hidden>繼續遊戲</button>
            <button id="btn-menu-help" class="big">遊戲說明</button>
          </div>
          <p class="best" id="best"></p>
        </div>
      </div>

      <div id="help" class="overlay" hidden>
        <div class="dialog wide">
          <button class="close" data-close="help">✕</button>
          <h1>遊戲說明</h1>
          <div id="help-content"></div>
        </div>
      </div>

      <div id="result" class="overlay" hidden>
        <div class="dialog">
          <h1 id="result-title"></h1>
          <div id="result-body"></div>
          <div class="actions" id="result-actions"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
